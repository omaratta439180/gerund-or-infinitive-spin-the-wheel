<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gerund or Infinitive — Spin the Wheel</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1a202c;
    --muted: #64748b;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --success: #10b981;
    --error: #ef4444;
    --border: #e2e8f0;
    --shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
    --wheel-bg: #fff;
  }
  [data-theme="dark"] {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #818cf8;
    --accent-hover: #a5b4fc;
    --success: #34d399;
    --error: #f87171;
    --border: #334155;
    --shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
    --wheel-bg: #1e293b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    transition: background 0.3s, color 0.3s;
    line-height: 1.5;
  }
  .container {
    max-width: 520px;
    margin: 0 auto;
    padding: 12px 16px 40px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-top: 8px;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .theme-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 40px; height: 40px;
    cursor: pointer;
    font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow);
    transition: transform 0.2s;
  }
  .theme-btn:active { transform: scale(0.9); }

  /* Score board */
  .scores {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .score-card {
    background: var(--card);
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .score-card .num {
    font-size: 1.4rem;
    font-weight: 700;
    display: block;
  }
  .score-card .label {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .score-card.correct .num { color: var(--success); }
  .score-card.wrong .num { color: var(--error); }
  .score-card.remaining .num { color: var(--accent); }

  /* Category chips */
  .chips-wrap {
    margin-bottom: 14px;
  }
  .chips-label {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
    color: var(--text);
  }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .chip:active { transform: scale(0.95); }

  /* Wheel area */
  .wheel-section {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 18px;
  }
  .pointer {
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 22px solid var(--error);
    position: relative;
    z-index: 10;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    margin-bottom: -6px;
  }
  .wheel-wrap {
    position: relative;
    width: min(90vw, 340px);
    height: min(90vw, 340px);
  }
  canvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: var(--shadow), 0 0 0 6px var(--card);
    background: var(--wheel-bg);
  }
  .spin-btn {
    margin-top: 18px;
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 14px 48px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 20px -4px rgba(79,70,229,0.5);
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .spin-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -4px rgba(79,70,229,0.6); }
  .spin-btn:active { transform: scale(0.96); }
  .spin-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* Result panel */
  .result-panel {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    display: none;
    animation: slideUp 0.35s ease;
  }
  .result-panel.show { display: block; }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-word {
    font-size: 1.6rem;
    font-weight: 800;
    text-align: center;
    margin-bottom: 4px;
    color: var(--accent);
  }
  .result-ar {
    text-align: center;
    font-size: 1.05rem;
    color: var(--muted);
    margin-bottom: 16px;
    direction: rtl;
  }
  .question {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .opt-btn {
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.95rem;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    color: var(--text);
    font-weight: 500;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
  }
  .opt-btn.correct {
    background: color-mix(in srgb, var(--success) 15%, transparent);
    border-color: var(--success);
    color: var(--success);
  }
  .opt-btn.wrong {
    background: color-mix(in srgb, var(--error) 12%, transparent);
    border-color: var(--error);
    color: var(--error);
  }
  .opt-btn:disabled { cursor: default; }
  .feedback {
    margin-top: 14px;
    padding: 12px;
    border-radius: 10px;
    font-size: 0.9rem;
    text-align: center;
    display: none;
  }
  .feedback.ok {
    display: block;
    background: color-mix(in srgb, var(--success) 15%, transparent);
    color: var(--success);
  }
  .feedback.bad {
    display: block;
    background: color-mix(in srgb, var(--error) 12%, transparent);
    color: var(--error);
  }
  .next-btn {
    display: none;
    width: 100%;
    margin-top: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .next-btn.show { display: block; }
  .next-btn:hover { background: var(--accent-hover); }

  .empty-msg {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 1.1rem;
  }
  .empty-msg span { font-size: 2.5rem; display: block; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Gerund / Infinitive Wheel</h1>
    <button class="theme-btn" id="themeBtn" title="Toggle theme">🌙</button>
  </header>

  <div class="scores">
    <div class="score-card correct"><span class="num" id="scCorrect">0</span><span class="label">Correct</span></div>
    <div class="score-card wrong"><span class="num" id="scWrong">0</span><span class="label">Wrong</span></div>
    <div class="score-card remaining"><span class="num" id="scRemain">0</span><span class="label">Left</span></div>
    <div class="score-card"><span class="num" id="scTotal">0</span><span class="label">Total</span></div>
  </div>

  <div class="chips-wrap">
    <div class="chips-label">Categories (tap to toggle)</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="wheel-section">
    <div class="pointer"></div>
    <div class="wheel-wrap">
      <canvas id="wheel" width="680" height="680"></canvas>
    </div>
    <button class="spin-btn" id="spinBtn">SPIN</button>
  </div>

  <div class="result-panel" id="resultPanel">
    <div class="result-word" id="resWord"></div>
    <div class="result-ar" id="resAr"></div>
    <div class="question">What comes after this word?</div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">Spin Again</button>
  </div>
</div>

const RULE_LABELS = {
  "gerund": "gerund (v-ing)",
  "to-inf": "to + infinitive",
  "bare": "infinitive without to",
  "both": "both gerund & infinitive"
};

const CAT_LABELS = {
  gerund: "Gerund verbs",
  prep: "After prepositions",
  expr: "Expressions",
  inf: "Infinitive verbs",
  "obj-to": "Verb + object + to",
  bare: "Without \"to\"",
  "both-small": "Both (small change)",
  "both-big": "Both (big change)",
  notes: "Notes (special)"
};

const COLORS = ["#4f46e5","#06b6d4","#10b981","#f59e0b","#ef4444","#8b5cf6"];

/* ===================== STATE ===================== */
let activeCats = new Set(Object.keys(CAT_LABELS));
let pool = [];          // current items still to answer
let currentItem = null;
let angle = 0;
let spinning = false;
let correctCount = 0;
let wrongCount = 0;

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const spinBtn = document.getElementById("spinBtn");
const resultPanel = document.getElementById("resultPanel");
const nextBtn = document.getElementById("nextBtn");

/* ===================== INIT ===================== */
function init() {
  buildChips();
  rebuildPool();
  drawWheel();
  updateScores();
  document.getElementById("themeBtn").addEventListener("click", toggleTheme);
  spinBtn.addEventListener("click", spin);
  nextBtn.addEventListener("click", () => {
    resultPanel.classList.remove("show");
    spinBtn.disabled = false;
    if (pool.length === 0) {
      showEmpty();
    }
  });
  // restore theme
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
    document.getElementById("themeBtn").textContent = "☀️";
  }
}

function toggleTheme() {
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  if (isDark) {
    document.documentElement.removeAttribute("data-theme");
    document.getElementById("themeBtn").textContent = "🌙";
    localStorage.setItem("theme", "light");
  } else {
    document.documentElement.setAttribute("data-theme", "dark");
    document.getElementById("themeBtn").textContent = "☀️";
    localStorage.setItem("theme", "dark");
  }
}

function buildChips() {
  const el = document.getElementById("chips");
  el.innerHTML = "";
  // All
  const allChip = document.createElement("button");
  allChip.className = "chip active";
  allChip.textContent = "All";
  allChip.dataset.cat = "all";
  allChip.onclick = () => {
    activeCats = new Set(Object.keys(CAT_LABELS));
    document.querySelectorAll(".chip").forEach(c => {
      if (c.dataset.cat !== "reset") c.classList.add("active");
    });
    rebuildPool();
  };
  el.appendChild(allChip);

  Object.entries(CAT_LABELS).forEach(([key, label]) => {
    const chip = document.createElement("button");
    chip.className = "chip active";
    chip.textContent = label;
    chip.dataset.cat = key;
    chip.onclick = () => {
      if (activeCats.has(key)) {
        activeCats.delete(key);
        chip.classList.remove("active");
      } else {
        activeCats.add(key);
        chip.classList.add("active");
      }
      // update All chip
      const all = document.querySelector('.chip[data-cat="all"]');
      if (activeCats.size === Object.keys(CAT_LABELS).length) all.classList.add("active");
      else all.classList.remove("active");
      rebuildPool();
    };
    el.appendChild(chip);
  });

  // Reset scores
  const resetChip = document.createElement("button");
  resetChip.className = "chip";
  resetChip.textContent = "Reset scores";
  resetChip.dataset.cat = "reset";
  resetChip.onclick = () => {
    correctCount = 0;
    wrongCount = 0;
    rebuildPool();
  };
  el.appendChild(resetChip);
}

function rebuildPool() {
  pool = DATA.filter(d => activeCats.has(d.cat)).map(d => ({...d}));
  // shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  updateScores();
  drawWheel();
  resultPanel.classList.remove("show");
  spinBtn.disabled = pool.length === 0;
}

function updateScores() {
  document.getElementById("scCorrect").textContent = correctCount;
  document.getElementById("scWrong").textContent = wrongCount;
  document.getElementById("scRemain").textContent = pool.length;
  document.getElementById("scTotal").textContent = DATA.filter(d => activeCats.has(d.cat)).length;
}

/* ===================== WHEEL DRAW ===================== */
function drawWheel() {
  const n = pool.length;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const r = Math.min(cx, cy) - 8;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (n === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--border").trim() || "#e2e8f0";
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim() || "#64748b";
    ctx.font = "28px system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("No items", cx, cy);
    return;
  }

  const slice = (Math.PI * 2) / n;
  const showLabels = n <= 45;

  for (let i = 0; i < n; i++) {
    const start = angle + i * slice;
    const end = start + slice;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    if (showLabels) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(start + slice / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#fff";
      ctx.font = `bold ${Math.max(11, Math.min(16, 280 / n))}px system-ui`;
      ctx.shadowColor = "rgba(0,0,0,0.4)";
      ctx.shadowBlur = 3;
      const label = pool[i].en.length > 14 ? pool[i].en.slice(0, 12) + "…" : pool[i].en;
      ctx.fillText(label, r - 12, 4);
      ctx.restore();
    }
  }

  // center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 28, 0, Math.PI * 2);
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--card").trim() || "#fff";
  ctx.fill();
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--border").trim() || "#e2e8f0";
  ctx.lineWidth = 3;
  ctx.stroke();
}

/* ===================== SPIN ===================== */
function spin() {
  if (spinning || pool.length === 0) return;
  spinning = true;
  spinBtn.disabled = true;
  resultPanel.classList.remove("show");

  const n = pool.length;
  const slice = 360 / n;
  // pick random index
  const idx = Math.floor(Math.random() * n);
  // target angle so that the middle of the slice lands under the top pointer
  // pointer is at top = -90deg in canvas coords (or 270deg)
  // we want the slice center to be at the top after rotation
  const targetSliceCenter = (idx + 0.5) * slice;
  // extra full spins for effect (but total duration ~0.3s so keep small)
  const extraSpins = 2 + Math.random() * 2;
  const finalDeg = extraSpins * 360 + (360 - targetSliceCenter);

  const startAngle = angle * (180 / Math.PI);
  const startTime = performance.now();
  const duration = 300; // ms — very fast as requested

  function animate(now) {
    const t = Math.min(1, (now - startTime) / duration);
    // ease-out cubic
    const ease = 1 - Math.pow(1 - t, 3);
    const currentDeg = startAngle + finalDeg * ease;
    angle = (currentDeg * Math.PI) / 180;
    drawWheel();
    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      // finalize exact angle
      angle = ((360 - targetSliceCenter) * Math.PI) / 180;
      drawWheel();
      showResult(pool[idx], idx);
    }
  }
  requestAnimationFrame(animate);
}

/* ===================== RESULT & QUIZ ===================== */
function showResult(item, idx) {
  currentItem = { item, idx };
  document.getElementById("resWord").textContent = item.en;
  document.getElementById("resAr").textContent = item.ar;

  // build options — always the 4 possible rules, shuffled a bit but keep order sensible
  const allRules = ["gerund", "to-inf", "bare", "both"];
  // shuffle options for variety
  for (let i = allRules.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [allRules[i], allRules[j]] = [allRules[j], allRules[i]];
  }

  const optsEl = document.getElementById("options");
  optsEl.innerHTML = "";
  allRules.forEach(r => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = RULE_LABELS[r];
    btn.dataset.rule = r;
    btn.onclick = () => checkAnswer(r, btn);
    optsEl.appendChild(btn);
  });

  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").textContent = "";
  nextBtn.classList.remove("show");
  resultPanel.classList.add("show");
}

function checkAnswer(chosen, btn) {
  const correctRule = currentItem.item.rule;
  const allBtns = document.querySelectorAll(".opt-btn");
  allBtns.forEach(b => b.disabled = true);

  if (chosen === correctRule) {
    btn.classList.add("correct");
    document.getElementById("feedback").className = "feedback ok";
    document.getElementById("feedback").textContent = "✓ Correct!";
    correctCount++;
    // remove from pool
    pool.splice(currentItem.idx, 1);
  } else {
    btn.classList.add("wrong");
    // highlight the right one
    allBtns.forEach(b => {
      if (b.dataset.rule === correctRule) b.classList.add("correct");
    });
    document.getElementById("feedback").className = "feedback bad";
    document.getElementById("feedback").textContent = "✗ Wrong. Correct answer: " + RULE_LABELS[correctRule];
    wrongCount++;
    // keep item in pool (already there)
  }
  updateScores();
  drawWheel();
  nextBtn.classList.add("show");
  if (pool.length === 0) {
    nextBtn.textContent = "All done! Reset categories to continue";
  } else {
    nextBtn.textContent = "Spin Again";
  }
}

function showEmpty() {
  resultPanel.innerHTML = `<div class="empty-msg"><span>🎉</span>Great job! No items left in the selected categories.<br>Toggle categories or hit Reset scores.</div>`;
  resultPanel.classList.add("show");
}

init();
</script>
